[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-analytics"
version = "0.1.0"
description = "Data quality checks, quality metrics and anomaly detection for the trading-risk-platform database"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.1.1",
    "SQLAlchemy==2.1.8",
    "psycopg[binary]==3.3.8",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
include = ["trading_analytics*"]

[tool.setuptools.package-data]
trading_analytics = ["sql/*.sql"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
